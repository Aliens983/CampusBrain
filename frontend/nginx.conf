# ============================================================
# Nginx 配置 — 前端静态文件 + 后端 API 反向代理
# ============================================================

server {
    listen       80;
    server_name  localhost;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # 静态资源（带 hash 的文件可长期缓存）
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # KB 路径已带 /api/v1/kb 前缀，直接透传给网关（最长前缀优先匹配）
    location /api/v1/kb/ {
        proxy_pass http://gateway:80/api/v1/kb/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        # SSE 流式问答需要更长读超时，禁用缓冲避免流式响应被聚合
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    # CAS 路径（/api/captcha、/api/auth/** 等）补上 /v1 再转发给网关
    location /api/ {
        proxy_pass http://gateway:80/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        # SSE 流式问答需要更长读超时，禁用缓冲避免流式响应被聚合
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    # 上传文件代理（免鉴权直出：URL 为不可枚举的 UUID）
    # 安全头（4.1.14）：nosniff 阻止浏览器把文本嗅探成 HTML；
    # sandbox 禁脚本/弹窗，图片内联展示不受影响
    location /uploads/ {
        proxy_pass http://backend:18080/uploads/;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    # 4.14：Knife4j/Swagger 文档代理已移除。
    # 文档属敏感面（接口结构/参数枚举），生产边界不得暴露；本地联调需要时
    # 在 gateway 与 cas 侧显式开启 swagger-enabled 并直连服务端口，不经公网 nginx。

    # 前端页面 — Vue Router history 模式必须回退到 index.html
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 错误页
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
