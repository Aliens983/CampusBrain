server:
  port: 8888

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # Nacos 开启鉴权时由 NACOS_USERNAME/NACOS_PASSWORD 注入；未开启时留空即可
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      # CORS 唯一入口（4.1.8）：所有跨域在网关统一处理，
      # 下游 CAS/KB 不再各自配置，避免「同一域名两处配、漏配一处部分接口失败」。
      # 预检 OPTIONS 由网关直接应答，不转发下游。
      # 允许的来源通过环境变量 CORS_ALLOWED_ORIGINS 注入（逗号分隔）。
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80}
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      # 下游误回 CORS 头时去重，避免出现重复 Access-Control-Allow-Origin 头
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_UNIQUE
      routes:
        # CAS 服务：路径已含 /api/v1（CAS 自身 context-path 也是 /api/v1），不剥前缀
        - id: cas-service
          uri: lb://cas-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/captcha, /api/v1/captcha/**, /api/v1/users/**, /api/v1/admin/**, /api/v1/app/**, /api/v1/appointments/**, /api/v1/teacher/**, /api/v1/weather/**, /api/v1/uploads/**
        # KB 服务：KB 自带 context-path=/api/v1/kb（与 CAS 同一约定），网关原样转发不剥前缀
        - id: kb-service
          uri: lb://kb-service
          predicates:
            - Path=/api/v1/kb/**

# 与 CAS 共享的 JWT 密钥（网关验签用）
# 无默认值：未注入即启动失败，避免生产静默回退到仓库里公开的常量密钥
# 本地开发请在 backend/.env 中填写（.env.example 提供了仅本机可用的占位值）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# 内网签名密钥（网关签发、服务端校验）
auth:
  internal-sign-secret: ${INTERNAL_SIGN_SECRET}

logging:
  level:
    com.laoliu.gateway: info
  pattern:
    # 5.2.1：[%X{traceId}] 与 CAS、KB 对齐；traceId 由 TraceIdGlobalFilter 生成并透传
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# 5.2.2：Prometheus 指标走独立管理端口 9103（容器内网），不在业务 80 端口暴露
management:
  # Actuator 独立管理端口：业务 80 上不再暴露 /actuator 端点，
  # Prometheus 走容器内网 9103（compose 不发布到宿主机），无需进入鉴权白名单
  server:
    port: ${MANAGEMENT_SERVER_PORT:9103}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # 容器探活走 /actuator/health/liveness（仅反映进程存活）
      probes:
        enabled: true
  metrics:
    tags:
      application: gateway
