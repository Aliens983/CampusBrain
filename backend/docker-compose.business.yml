# ============================================================================
# 业务服务部署编排 — 必须与基础设施编排叠加使用，不能单独启动：
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.business.yml \
#                  [-f docker-compose.observability.yml] up -d
#
# 职责边界（每个服务只允许在一个文件中定义，6.2.2）：
#   - docker-compose.yml：基础设施底座（Nacos / KB 的 MySQL/Redis/ES/Qdrant/RabbitMQ）
#   - 本文件：业务服务（gateway / cas-service / kb-service / frontend）
#     及 CAS 专属中间件（cas-mysql / cas-redis；开发时 CAS 用宿主机 MySQL/Redis）
#
# 文档文件存储：kb-service 使用本地磁盘（容器内 /file，命名卷 kb-file-data 持久化），
# CAS 上传文件使用 cas-uploads 卷；项目不部署 MinIO。
#
# Schema 唯一来源是 Flyway（6.2.4）：cas-mysql 不再挂载 initdb 脚本，
# 全新空库由 cas-service 启动时 Flyway 自动建表（V1~V8）。
#
# 镜像 tag 通过 ${TAG} 注入（默认 latest），pull_policy: never 保证用本地刚构建的镜像；
# 所有密钥从环境变量插值（Jenkins 注入），避免硬编码。
#
# 端口约定（宿主机）：
#   网关 8888 → 容器 80；CAS 18080；KB 8081；前端 80；cas-mysql 13306；cas-redis 16379
# ============================================================================

name: ${COMPOSE_PROJECT_NAME:-campus-appointment}

services:
  # ---------------- CAS 专属中间件 ----------------
  cas-mysql:
    image: mysql:8.0
    container_name: cas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cas_db
    ports:
      - "13306:3306"   # 宿主机 13306 仅用于调试，业务服务走容器内网 3306
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - cas-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  cas-redis:
    image: redis:7.2-alpine
    container_name: cas-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - cas-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------- 业务服务 ----------------
  gateway:
    image: gateway:${TAG:-latest}
    pull_policy: never
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8888:80"            # 宿主机 8888 → 容器 80（前端 nginx 的 proxy_pass 指向 gateway:80）
    environment:
      SERVER_PORT: 80        # Spring Boot 环境变量覆盖：让网关在容器内监听 80，与 nginx 约定一致
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SIGN_SECRET: ${INTERNAL_SIGN_SECRET}
      # 跨域唯一配置入口（4.1.8）；逗号分隔的前端来源
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80}
    depends_on:
      nacos:
        condition: service_healthy

  cas-service:
    image: cas-service:${TAG:-latest}
    pull_policy: never
    container_name: cas-service
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      NACOS_ADDR: nacos:8848
      # Spring Boot 宽松绑定：环境变量覆盖 application.yml 中写死的 localhost 配置
      SPRING_DATASOURCE_URL: jdbc:mysql://cas-mysql:3306/cas_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: cas-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: kb-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SIGN_SECRET: ${INTERNAL_SIGN_SECRET}
      FILE_UPLOAD_PATH: /app/uploads/
      FILE_UPLOAD_DIR: uploads
      # 运行所需密钥（对应新配置的无默认值占位符）
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
      # 演示模式：开启后每次启动 flyway clean→migrate 重建 cas_db（数据不保留）。
      # 6.2 起默认全部安全（不清库/禁 clean/不清 Redis）；纯演示环境在宿主机 .env
      # 或导出环境变量显式打开：APP_DB_RESET_ON_STARTUP=true + FLYWAY_CLEAN_DISABLED=false
      # + APP_REDIS_FLUSH_ON_RESET=true（三道开关缺一不动 Redis，见 DbResetConfig 6.3）。
      APP_DB_RESET_ON_STARTUP: ${APP_DB_RESET_ON_STARTUP:-false}
      FLYWAY_CLEAN_DISABLED: ${FLYWAY_CLEAN_DISABLED:-true}
      APP_REDIS_FLUSH_ON_RESET: ${APP_REDIS_FLUSH_ON_RESET:-false}
    volumes:
      - cas-uploads:/app/uploads
    depends_on:
      nacos:
        condition: service_healthy
      cas-mysql:
        condition: service_healthy
      cas-redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend   # 前端 nginx.conf 里 /uploads 代理到 backend:18080（4.14 起 /doc.html 等文档代理已移除）

  kb-service:
    image: kb-service:${TAG:-latest}
    pull_policy: never
    container_name: kb-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: kb-mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${KB_MYSQL_ROOT_PASSWORD}
      REDIS_HOST: kb-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: kb-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # 文档落地到容器内 /file（命名卷持久化），重启不丢；FILE_STORAGE_PATH 为绝对路径时直接使用
      FILE_STORAGE_PATH: /file
      ES_HOST: kb-es
      ES_PORT: 9200
      QDRANT_HOST: kb-qdrant
      QDRANT_PORT: 6334
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SIGN_SECRET: ${INTERNAL_SIGN_SECRET}
      # 容器统一走 docker profile（INFO 日志、仅控制台输出；jar 内不再写死 active profile）
      SPRING_PROFILES_ACTIVE: docker
      # 大模型：对话走 DeepSeek（OpenAI 兼容接口），Embedding 走硅基流动
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      # 默认不清库（数据持久化）。纯演示环境在宿主机 .env 或导出环境变量显式打开：
      # APP_DB_RESET_ON_STARTUP=true + FLYWAY_CLEAN_DISABLED=false（双开关缺一不动库）
      APP_DB_RESET_ON_STARTUP: ${APP_DB_RESET_ON_STARTUP:-false}
      FLYWAY_CLEAN_DISABLED: ${FLYWAY_CLEAN_DISABLED:-true}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      nacos:
        condition: service_healthy
      kb-mysql:
        condition: service_healthy
      kb-redis:
        condition: service_healthy
      kb-es:
        condition: service_healthy
      kb-qdrant:
        condition: service_healthy
      kb-rabbitmq:
        condition: service_healthy
    volumes:
      - kb-file-data:/file

  frontend:
    image: frontend:${TAG:-latest}
    pull_policy: never
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"   # nginx 托管静态页 + 反向代理到 gateway/cas-service
    depends_on:
      - gateway
      - cas-service

volumes:
  cas-mysql-data:
  cas-redis-data:
  cas-uploads:
  kb-file-data:
