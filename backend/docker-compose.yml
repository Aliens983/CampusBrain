# ============================================================
# 中间件编排（Nacos + KB 中间件）— 不含业务服务
# 三个业务服务（gateway/cas-service/kb-service）在本地运行：
#   IDEA 直接启动，或 `java -jar` 启动
# CAS 依赖的 MySQL/Redis 使用宿主机（localhost:3306/6379）
# KB 的中间件全部在此编排
# ============================================================
services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"

  kb-mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${KB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: knowledge_base
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - kb-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${KB_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  kb-redis:
    image: redis:7.2-alpine
    container_name: kb-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - kb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kb-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: kb-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - kb-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kb-qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: kb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - kb-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD.* 0A ' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  kb-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - kb-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kb-minio:
    image: minio/minio:latest
    container_name: kb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kb-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  kb-mysql-data:
  kb-redis-data:
  kb-es-data:
  kb-qdrant-data:
  kb-rabbitmq-data:
  kb-minio-data:
