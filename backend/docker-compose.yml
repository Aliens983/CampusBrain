# ============================================================
# 基础设施编排（Nacos + KB 中间件）— 底座文件，不承载业务服务
#
# 本地开发（业务进程跑在 IDEA）：
#   docker compose -f docker-compose.yml up -d
# 全栈部署必须叠加业务编排（6.2.2：每个服务只在一个文件定义）：
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.business.yml \
#                  [-f docker-compose.observability.yml] up -d
#
# CAS 依赖的 MySQL/Redis：由 docker-compose.business.yml 提供 cas-mysql/cas-redis
# 容器（127.0.0.1:13306/16379），本地 IDE 与容器化部署均使用，不用宿主机原生服务。
# ============================================================
name: ${COMPOSE_PROJECT_NAME:-campus-appointment}

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 鉴权默认关闭（本地开发）；部署到非可信网络时在 .env 置 NACOS_AUTH_ENABLE=true
      # 并填写下面四项（token 需 Base64 编码且长度 ≥ 32 字节），同时给各业务服务
      # 配置 NACOS_USERNAME / NACOS_PASSWORD
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
    ports:
      # 仅绑回环：注册中心不对宿主机所在网络暴露
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kb-mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${KB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: knowledge_base
      # 容器 OS 与 MySQL 会话时区统一东八区：DATETIME 列的 DEFAULT CURRENT_TIMESTAMP
      # 才会写北京时间；否则容器默认 UTC，与 JVM/serverTimezone=Asia/Shanghai 混用差 8 小时
      TZ: Asia/Shanghai
    ports:
      # 仅绑回环：数据库不对宿主机所在网络暴露，调试可用 127.0.0.1:3307
      - "127.0.0.1:3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    volumes:
      - kb-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${KB_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  kb-redis:
    image: redis:7.2-alpine
    container_name: kb-redis
    restart: unless-stopped
    environment:
      # 留空则不启用口令（本地开发）；部署时在 .env 设置 KB_REDIS_PASSWORD
      KB_REDIS_PASSWORD: ${KB_REDIS_PASSWORD:-}
    # requirepass 传空串等价于关闭认证（Redis 语义），保证留空时本地行为不变
    command: ["sh", "-c", "exec redis-server --requirepass \"$${KB_REDIS_PASSWORD}\""]
    ports:
      # 仅绑回环：Redis 内有验证码/会话等明文数据，不向宿主机所在网络暴露
      - "127.0.0.1:6380:6379"
    volumes:
      - kb-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${KB_REDIS_PASSWORD:+-a $$KB_REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  kb-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: kb-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      # ES 未启用 xpack 安全模块（演示单机部署），故只绑回环，不向宿主机所在网络暴露；
      # 业务流量走容器内网。需要跨主机访问时必须先开启 xpack 安全与 HTTPS
      - "127.0.0.1:9200:9200"
    volumes:
      - kb-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kb-qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: kb-qdrant
    restart: unless-stopped
    environment:
      # Qdrant v1.9 行为：该变量只要被注入（即使空串）也强制鉴权，
      # 故本地开发在 .env 配固定 dev key（compose / kb 应用 / reset 脚本三处一致），
      # 部署时改为 openssl rand -base64 24
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      # 仅绑回环：向量库不对宿主机所在网络暴露
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - kb-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD.* 0A ' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  kb-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # 仅绑回环（AMQP 与管理台均已设口令，管理台仍不对宿主机所在网络暴露）
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - kb-rabbitmq-data:/var/lib/rabbitmq
      # 除管理插件外启用内置 rabbitmq_prometheus（容器内 15692/metrics，供 Prometheus 抓队列积压）
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  kb-mysql-data:
  kb-redis-data:
  kb-es-data:
  kb-qdrant-data:
  kb-rabbitmq-data:

# 固定子网，避开宿主机可能所在的 172.16~31 段（iPhone 热点固定 172.20.10.x，
# 曾与 Docker 默认分配的 172.20.0.0/16 冲突导致容器端口全部超时）。
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24
