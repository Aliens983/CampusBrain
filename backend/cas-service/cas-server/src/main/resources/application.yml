server:
  port: 18080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: cas-service
  config:
    import: optional:nacos:cas-service.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # Nacos 开启鉴权时由 NACOS_USERNAME/NACOS_PASSWORD 注入；未开启时留空即可
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    sentinel:
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            data-id: cas-sentinel-flow-rules
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  servlet:
    multipart:
      # 上传仅面向图片/办公文档（轮播图等），10MB 足够；
      # FileServiceImpl 内还有同名配置的第二道大小校验（4.1.14）
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          starttls:
            enable: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发默认连 docker-compose.business.yml 起的 cas-mysql 容器（127.0.0.1:13306）；
    # 容器化部署时由 SPRING_DATASOURCE_URL 覆盖为 cas-mysql:3306
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/${DB_NAME:cas_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      # 本地开发 Redis 无口令时留空；容器由 compose 注入 CAS_REDIS_PASSWORD
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: 0

  # Flyway 数据库迁移：启动自动执行 classpath:db/migration 下的 V*.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true    # 开发期表结构统一维护在 V1 全量基线，结构变更后用 scripts/reset-dev-env.sh 清库重启，不写增量脚本、不靠 flyway repair 绕过校验
    # 默认禁用 clean：清库能力必须由部署侧显式放开（FLYWAY_CLEAN_DISABLED=false），
    # 避免误设 APP_DB_RESET_ON_STARTUP 就无声清空生产库
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.laoliu.cas.**.dataobject
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 无默认值：未注入即启动失败，避免生产静默回退到仓库里公开的常量密钥
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

auth:
  internal-sign-secret: ${INTERNAL_SIGN_SECRET}

# 预约模块业务参数
booking:
  # 幂等去重窗口（秒）：同一用户对同一资源在该窗口内的待审核重复提交会被去重
  dedupe-seconds: ${BOOKING_DEDUPE_SECONDS:60}

file:
  upload:
    dir: uploads
    path: ./uploads/
    prefix: /api/files/
    url-prefix: /uploads
    server-address: http://localhost:18080

email:
  subject: 验证码
  content: 您的验证码是：
  code:
    expiration: 300
  send:
    frequency:
      limit: 60

logging:
  level:
    com.laoliu: info
  pattern:
    # 5.2.1：[%X{traceId}] 与网关、KB 对齐，支撑跨服务日志关联
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

weather:
  api:
    url: https://cn.apihz.cn/api/tianqi/tqyb.php
    id: ${WEATHER_API_ID:10015369}
    key: ${WEATHER_API_KEY}

# ============ AI 大模型配置 ============
deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  api-url: https://api.deepseek.com
  timeout: 60000

qwen:
  api-key: ${QWEN_API_KEY:}
  api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  timeout: 30000

aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: coding-king-liu
  sms:
    sign-name: 校园预约系统
  access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
  region-id: cn-hangzhou

management:
  # Actuator 独立管理端口：业务 18080 上不再暴露任何 /actuator 端点，
  # Prometheus 与镜像 HEALTHCHECK 走容器内网 9101（compose 不发布到宿主机），
  # 因此无需放开安全链，避免指标端点在业务端口被未认证访问
  server:
    port: ${MANAGEMENT_SERVER_PORT:9101}
  endpoints:
    web:
      exposure:
        # 5.2.2：prometheus 供 Prometheus 抓取（在容器内网，不对外暴露）
        include: health,info,prometheus
  metrics:
    tags:
      application: cas-server
  endpoint:
    health:
      show-details: when_authorized
      # 启用 liveness/readiness 探针组：liveness 只反映进程存活（ApplicationAvailability），
      # 不含 db/redis/rabbit/mail 等依赖指示器——避免邮件/Rabbit 等外围依赖抖动导致
      # 容器被 HEALTHCHECK 判死反复重启；镜像探活与编排摘流走 /actuator/health/liveness。
      # 依赖完备性仍可在独立管理端口查 /actuator/health（聚合状态）。
      probes:
        enabled: true
  health:
    mail:
      enabled: true
