server:
  port: 18080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: cas-service
  config:
    import: optional:nacos:cas-service.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
    sentinel:
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            data-id: cas-sentinel-flow-rules
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  servlet:
    multipart:
      # 上传仅面向图片/办公文档（轮播图等），10MB 足够；
      # FileServiceImpl 内还有同名配置的第二道大小校验（4.1.14）
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          starttls:
            enable: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cas_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # Flyway 数据库迁移：启动自动执行 classpath:db/migration 下的 V*.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false   # V1 已裁剪孤儿表 ai_chat_history/file_info(2026-09-07)；服务器演示模式每次启动 clean+migrate，此项留 false 仅防本地存量库校验误报
    # 默认禁用 clean：清库能力必须由部署侧显式放开（FLYWAY_CLEAN_DISABLED=false），
    # 避免误设 APP_DB_RESET_ON_STARTUP 就无声清空生产库
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.laoliu.cas.**.dataobject
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 无默认值：未注入即启动失败，避免生产静默回退到仓库里公开的常量密钥
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

auth:
  internal-sign-secret: ${INTERNAL_SIGN_SECRET}

# 预约模块业务参数
booking:
  # 幂等去重窗口（秒）：同一用户对同一资源在该窗口内的待审核重复提交会被去重
  dedupe-seconds: ${BOOKING_DEDUPE_SECONDS:60}

file:
  upload:
    dir: uploads
    path: ./uploads/
    prefix: /api/files/
    url-prefix: /uploads
    server-address: http://localhost:18080

email:
  subject: 验证码
  content: 您的验证码是：
  code:
    expiration: 300
  send:
    frequency:
      limit: 60

logging:
  level:
    com.laoliu: info
  pattern:
    # 5.2.1：[%X{traceId}] 与网关、KB 对齐，支撑跨服务日志关联
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

weather:
  api:
    url: https://cn.apihz.cn/api/tianqi/tqyb.php
    id: ${WEATHER_API_ID:10015369}
    key: ${WEATHER_API_KEY}

# ============ AI 大模型配置 ============
deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  api-url: https://api.deepseek.com
  timeout: 60000

qwen:
  api-key: ${QWEN_API_KEY:}
  api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
  timeout: 30000

aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: coding-king-liu
  sms:
    sign-name: 校园预约系统
  access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
  region-id: cn-hangzhou

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: true
