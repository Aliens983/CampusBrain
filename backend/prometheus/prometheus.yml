# ============================================================
# Prometheus 抓取配置（5.2.2 / 可观测性）
#
# 三个目标均走容器内网的独立 Actuator 管理端口（不经过网关、不发布到宿主机，
# 因此指标端点不经业务安全链、也不对外暴露）：
#   gateway:9103     /actuator/prometheus
#   cas-service:9101 /actuator/prometheus（独立管理端口无 context-path）
#   kb-service:9102  /actuator/prometheus
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: campusbrain

# 告警规则（挂载于 /etc/prometheus/rules）
rule_files:
  - rules/*.yml

# Alertmanager（与 Prometheus 同在可观测性编排内）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:9103"]
        labels:
          service: gateway

  - job_name: cas-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cas-service:9101"]
        labels:
          service: cas-service

  - job_name: kb-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["kb-service:9102"]
        labels:
          service: kb-service

  # RabbitMQ 内置 rabbitmq_prometheus 插件（15692 端口，编排中已启用）
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["kb-rabbitmq:15692"]
        labels:
          service: rabbitmq

  # Prometheus 自监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
