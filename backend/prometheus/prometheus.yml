# ============================================================
# Prometheus 抓取配置（5.2.2 / 可观测性）
#
# 三个目标均走容器内网，不经过网关/公网：
#   gateway:80                  /actuator/prometheus
#   cas-service:18080           /api/v1/actuator/prometheus（context-path=/api/v1）
#   kb-service:8081             /api/v1/kb/actuator/prometheus（context-path=/api/v1/kb）
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: campusbrain

# 告警规则（挂载于 /etc/prometheus/rules）
rule_files:
  - rules/*.yml

# Alertmanager（与 Prometheus 同在可观测性编排内）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:80"]
        labels:
          service: gateway

  - job_name: cas-service
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets: ["cas-service:18080"]
        labels:
          service: cas-service

  - job_name: kb-service
    metrics_path: /api/v1/kb/actuator/prometheus
    static_configs:
      - targets: ["kb-service:8081"]
        labels:
          service: kb-service

  # RabbitMQ 内置 rabbitmq_prometheus 插件（15692 端口，编排中已启用）
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["kb-rabbitmq:15692"]
        labels:
          service: rabbitmq

  # Prometheus 自监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
