# ============================================================
# Knowledge Base Platform — Application Configuration
# ============================================================

# 与网关共享的内网签名密钥（校验 X-Internal-Sign）
# 无默认值：未注入即启动失败，避免生产静默回退到仓库里公开的常量密钥
auth:
  internal-sign-secret: ${INTERNAL_SIGN_SECRET}

# common-auth 的 JWTUtils 会被扫描实例化（KB 本身不验 JWT，但需占位属性）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

spring:
  application:
    name: kb-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    # Feign 超时：默认是连接 10s / 读取 60s。
    # 预约确认链路是「SSE → LLM → Feign → CAS」，60s 的读超时在 SSE 场景根本等不到结果，
    # 只会让 Tomcat 线程一直挂到容器超时；这里按交互式操作收紧。
    openfeign:
      # 启用 Feign 熔断器支持：否则 @FeignClient 上配置的 fallbackFactory 不会生效，
      # CAS 不可用时调用方会一直等到读超时（8s），SSE 链路被慢调用占满。
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
          # 预约类调用是用户正盯着等的操作，要求更短，失败快于让人干等
          cas-service:
            connect-timeout: 3000
            read-timeout: 8000
  # SSE 问答是异步请求：不配的话回落到容器默认（Tomcat 30s），
  # 而 LLM 与 Feign 的超时都大于 30s，回答稍长就会被容器掐断，前端只拿到半截答案。
  mvc:
    async:
      request-timeout: 120s
  profiles:
    active: dev

  # ---------- MySQL Datasource ----------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/knowledge_base?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ---------- RabbitMQ ----------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        # 消费端并发：并发数 3、最多扩展 5（1.7：注释口径与值对齐）；单文档的
        # embedding 批次另在 embeddingExecutor（默认 4 线程）内并发。
        # prefetch 从 1 提到 2：消费者处理当前大文档时可预取下一条，减少队列空转，
        # 同时避免预取过多把大文档批量压在单个消费者本地。
        concurrency: 3
        max-concurrency: 5
        prefetch: 2
        retry:
          enabled: true
          initial-interval: 3000ms
          max-attempts: 3

  # ---------- File Upload ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  # ---------- Jackson ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ---------- Flyway ----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false   # V1~V3 已裁剪孤儿表(2026-09-07)；服务器演示模式每次启动 clean+migrate，此项留 false 仅防本地存量库校验误报
    table: flyway_schema_history
    # 默认禁用 clean：清库能力必须由部署侧显式放开（FLYWAY_CLEAN_DISABLED=false），
    # 避免误设 APP_DB_RESET_ON_STARTUP 就无声清空生产库
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}

  # ---------- Graceful Shutdown ----------
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ---------- Server ----------
server:
  port: 8081
  # 与 CAS 一致：服务自带完整上下文前缀，网关原样转发、不剥前缀。
  # Controller 一律映射相对路径（/qa、/documents、/health），外部访问路径为 /api/v1/kb/**。
  servlet:
    context-path: /api/v1/kb
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
  compression:
    enabled: true
    mime-types: text/plain,text/html,text/css,application/json,text/event-stream

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# ---------- Elasticsearch ----------
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  index-name: kb_documents

# ---------- Qdrant Vector Database ----------
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: kb_chunks
  vector-size: 1024
  distance: Cosine

# ---------- LangChain4j / LLM ----------
# Chat 用 DeepSeek，Embedding 用硅基流动（不同服务，key 分开）
langchain4j:
  openai:
    api-key: ${OPENAI_API_KEY}
    chat-model:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      model-name: ${LLM_MODEL:deepseek-chat}
      temperature: 0.3
      max-tokens: 2048
      timeout: 60s
    embedding-model:
      api-key: ${EMBEDDING_API_KEY}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      model-name: ${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
      timeout: 120s

# ---------- LLM 跨供应商兜底（Q-06：统一配置注入，代码内不再 System.getenv） ----------
llm:
  provider: ${LLM_PROVIDER:deepseek}
  fallback:
    # 主模型失败后按供应商切换的备选聊天密钥；缺省回退同名环境变量
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    qwen-api-key: ${QWEN_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    # 硅基流动聊天 key 应与 embedding key 分开配置；
    # 未配置 SILICONFLOW_API_KEY 时才向后兼容复用 EMBEDDING_API_KEY（同账号 key 可用于 chat）
    siliconflow-api-key: ${SILICONFLOW_API_KEY:${EMBEDDING_API_KEY:}}

# ---------- Chunking Strategy ----------
chunking:
  default-size: 512
  default-overlap: 50
  strategy: sliding_window     # Options: fixed_size | sliding_window | semantic

# ---------- Retrieval Strategy ----------
retrieval:
  top-k-keyword: 10
  top-k-vector: 10
  final-top-k: 5
  similarity-threshold: 0.7
  rrf-k: 60                    # RRF constant k value

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ---------- Resilience4j Circuit Breaker ----------
resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 客户端主动断连导致的中止不是服务故障，不得计入熔断失败率（12-07）
        ignore-exceptions:
          - com.kb.infrastructure.rag.llm.StreamCancelledException
      embeddingService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3

# ---------- 问答缓存 ----------
kb:
  cache:
    # 开关同时控制精确缓存（Caffeine+Redis）与语义缓存（向量相似度 0.95）。
    # 仅纯知识类问题（未命中预约意图且会话无预约槽位、本地资料有命中）读写缓存；
    # 余量/档期/我的预约等实时数据绝不缓存。预约变更事件会整体淘汰存量缓存。
    enabled: ${KB_CACHE_ENABLED:true}
    # 语义缓存（Qdrant 独立 collection，12-02）
    semantic-collection: ${KB_SEMANTIC_CACHE_COLLECTION:qa_semantic_cache}
    semantic-threshold: ${KB_SEMANTIC_CACHE_THRESHOLD:0.95}
    semantic-ttl-hours: ${KB_SEMANTIC_CACHE_TTL_HOURS:24}
    # 过期点清理任务（3.8：查找只懒过滤，本任务定期删除已过 TTL 的点）
    semantic-cleanup-interval-ms: ${KB_SEMANTIC_CACHE_CLEANUP_INTERVAL_MS:21600000}
    semantic-cleanup-init-delay-ms: ${KB_SEMANTIC_CACHE_CLEANUP_INIT_DELAY_MS:600000}
    # 文档处理事件缓存失效合并窗口（3.7：批量上传 N 篇只跑一次全量淘汰，避免 N 次 SCAN 风暴）
    evict-merge-interval-ms: ${KB_CACHE_EVICT_MERGE_INTERVAL_MS:30000}
    evict-merge-init-delay-ms: ${KB_CACHE_EVICT_MERGE_INIT_DELAY_MS:60000}
  # 问答链路参数（Q-04/B-04：代码 @Value 已带同样默认值，此处显式声明便于运维调参）
  qa:
    # 拼装提示词时携带的最近对话历史条数
    history-limit: ${KB_QA_HISTORY_LIMIT:8}
    # 返回引用片段的最大截取字符数
    citation-snippet-length: ${KB_QA_CITATION_SNIPPET_LENGTH:120}
    # 单用户每日免费提问计数在 Redis 的 TTL（小时）；略大于 24h，跨天滚动窗口不被整点清空
    daily-counter-ttl-hours: ${KB_QA_DAILY_COUNTER_TTL_HOURS:25}
  # 混合检索（向量 + BM25）总预算超时
  retrieval:
    timeout-seconds: ${KB_RETRIEVAL_TIMEOUT_SECONDS:30}
    # 检索线程池大小（4.4：0=跟随 kb.sse.max-concurrent；检索为短时网络调用，
    # 线程数≈在途流式问答数×2，不再用大队列压住扩容）
    pool-size: ${KB_RETRIEVAL_POOL_SIZE:0}
  # 文档消费可靠性（12-03）
  document:
    processing-lock-ttl-seconds: ${KB_DOC_PROCESSING_LOCK_TTL:1800}
    # 处理锁续约周期（3.9 Watchdog：远小于锁 TTL，保证超长处理不失锁）
    processing-lock-renew-ms: ${KB_DOC_PROCESSING_LOCK_RENEW_MS:300000}
    # 本机锁登记剪枝阈值（3.9：长期无活动的 token/在途登记将被清理）
    processing-lock-prune-after-ms: ${KB_DOC_PROCESSING_LOCK_PRUNE_AFTER_MS:3600000}
    reclaim:
      stale-minutes: ${KB_DOC_RECLAIM_STALE_MINUTES:10}
      batch-size: ${KB_DOC_RECLAIM_BATCH:50}
      lock-ttl-seconds: ${KB_DOC_RECLAIM_LOCK_TTL:120}
      interval-ms: ${KB_DOC_RECLAIM_INTERVAL_MS:300000}
      initial-delay-ms: ${KB_DOC_RECLAIM_INITIAL_DELAY_MS:120000}
  # 外部索引删除失败补偿对账（A-04）
  index-cleanup:
    enabled: ${KB_INDEX_CLEANUP_ENABLED:true}
    batch-size: ${KB_INDEX_CLEANUP_BATCH:100}
    # 默认 24 次 ×5 分钟周期 = 约 2 小时补偿窗口；仍失败置 GIVE_UP 并打 give_up 指标
    max-retries: ${KB_INDEX_CLEANUP_MAX_RETRIES:24}
    interval-ms: ${KB_INDEX_CLEANUP_INTERVAL_MS:300000}
    initial-delay-ms: ${KB_INDEX_CLEANUP_INITIAL_DELAY_MS:180000}
  # 内存知识图谱容量护栏（12-10；中期落图存储后移除）
  graph:
    max-entities: ${KB_GRAPH_MAX_ENTITIES:50000}
    max-relations: ${KB_GRAPH_MAX_RELATIONS:200000}
  sse:
    # 单实例同时在途的流式问答连接上限；超限新请求在响应建立前直接收到 503。
    # 50 路并发 × 单轮约 30s ≈ 100 QPM 的持续吞吐，配合单用户频控与 boundedElastic 使用。
    max-concurrent: ${KB_SSE_MAX_CONCURRENT:50}
  embedding:
    # 单次 embedding API 请求携带的分块条数；文档内按此切批并发请求
    batch-size: ${KB_EMBEDDING_BATCH_SIZE:32}
    # 单文档内 embedding 批次的并发线程数（对模型 API 的并发预算）
    parallelism: ${KB_EMBEDDING_PARALLELISM:4}

# ---------- App Config ----------
app:
  file-storage-path: ${FILE_STORAGE_PATH:../file}
  security:
    token-header: Authorization
    mock-enable: false
    mock-secret: test
    access-token-validity-seconds: 7200
    refresh-token-validity-seconds: 604800

# ---------- SpringDoc / Knife4j ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      # 不能写 /api/**：context-path 是 /api/v1/kb，springdoc 按"不含 context-path 的
      # servlet 路径"匹配，Controller 实际映射的是 /qa/**、/documents/**、/health/**。
      # 写 /api/** 会过滤出空文档（打开 swagger 一个接口都看不到）。
      paths-to-match: /qa/**,/documents/**,/health/**
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-footer: false

# ---------- Logging ----------
logging:
  pattern:
    # 5.2.1：[%X{traceId}] 与网关、CAS 对齐；traceId 由 TraceIdFilter
    # 读取网关注入的 X-Trace-Id（无网关直连时自行生成）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.kb: DEBUG
    com.kb.infrastructure.persistence: INFO
