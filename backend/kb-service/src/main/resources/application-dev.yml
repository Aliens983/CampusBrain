# ============================================================
# Development Profile Configuration（敏感值一律走环境变量，见 backend/.env）
# ============================================================

# datasource 复用主配置 application.yml 的 ${DB_HOST}/${DB_PORT}
# （默认 localhost:3307，username root / password root123，仅本地开发默认值）。
# 此处不再覆盖 datasource，避免"本地跑通、容器里却连 localhost"这类不一致。

spring:
  # 本地开发直接从 backend/.env 读取配置（进程需在 backend 目录启动）；
  # optional 表示文件不存在时跳过，CI/无 .env 环境仍由真实环境变量注入。
  # [.properties] 显式指定解析器，避免 Spring 因扩展名 .env 而无法识别格式。
  config:
    import: optional:file:./.env[.properties]
  # 网易 163 邮箱 SMTP（本地发验证码用）
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true

# Chat / Embedding 的 key 由主配置的 ${OPENAI_API_KEY} / ${EMBEDDING_API_KEY} 提供，
# dev 不再硬编码真实 key。

logging:
  level:
    # 本地开发保留 DEBUG，容器/default profile 为 INFO
    com.kb: DEBUG
